# yaml-language-server: $schema=../../schema/workflow.schema.json
# Contracts and data flow on real models, no harness CLI involved:
# gpt-4o-mini classifies → claude-haiku-4.5 explains using the classification
# → the verifier checks the explanation actually names the classified label.
name: e2e-contracts
params:
  text: { default: 'The onboarding was painless and the support team answered within minutes.' }
  script: { required: true }

steps:
  - id: classify
    title: gpt-4o-mini labels the sentiment (json + schema)
    executor: { harness: command, timeout_min: 3 }
    run: 'node "{{script}}" --model openai/gpt-4o-mini --json --prompt "Classify the sentiment of this text as one of positive, negative, neutral, and give a confidence between 0 and 1. Text: {{text}}"'
    output:
      type: json
      schema:
        type: object
        required: [sentiment, confidence]
        properties:
          sentiment: { enum: [positive, negative, neutral] }
          confidence: { type: number, minimum: 0, maximum: 1 }

  - id: explain
    title: claude-haiku-4.5 explains, reading the label from the run context
    executor: { harness: command, timeout_min: 3 }
    run: 'node "{{script}}" --model anthropic/claude-haiku-4.5 --context-path steps.classify.output --write explanation.txt --prompt "In two sentences, explain why the text below got the sentiment label given in the context. Use the label word itself in your answer. Text: {{text}}"'
    output: { type: text }
    verify:
      # The expectation is substituted from step 1's output; the file was
      # written by step 2. The two models have to agree.
      - type: artifact
        path: explanation.txt
        contains: '{{steps.classify.output.sentiment}}'
